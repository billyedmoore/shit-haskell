name: Native runtime

on:
  pull_request:
    paths:
      - 'crates/hsc/src/**'
      - 'bench/progs/**'
      - 'tools/runtimebench.py'
      - '.github/workflows/runtime.yml'

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.92.0'

jobs:
  runtime:
    name: Native runtime benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Before
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: before
          persist-credentials: false
      - name: After
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: after
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - name: GHC oracle
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.12.2'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            before -> target
            after -> target
      - name: Build both compilers
        run: |
          cargo build --release -p hsc --manifest-path before/Cargo.toml
          cargo build --release -p hsc --manifest-path after/Cargo.toml
      - name: Measure native runtime (hsc against GHC at -O0, -O1 and -O2)
        env:
          # Both compilers build against the same libraries: the change's own.
          HSC_LIBDIR: ${{ github.workspace }}/after/libs
        run: >-
          python3 after/tools/runtimebench.py
          --before before/target/release/hsc --after after/target/release/hsc
          --levels 0,1,2 --runs 5 --cpu auto
          --bench after/bench/progs --work "$RUNNER_TEMP/runtimebench"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Save measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime
          retention-days: 14
          path: |
            ${{ runner.temp }}/runtimebench/times.json
            ${{ runner.temp }}/runtimebench/chart.md
            ${{ runner.temp }}/runtimebench/*/*/*.stdout
            ${{ runner.temp }}/runtimebench/*/*/*.stderr
          if-no-files-found: ignore
